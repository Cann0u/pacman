[project]
name = "pacman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mazegen",
    "pydantic>=2.0",
    "pygame>=2.6.1",
]

[tool.uv.sources]
mazegen = { path = "mazegen-0.1.0-py3-none-any.whl" }

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "mazegen"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true